<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>헤어이어 — 지금 바로 갈 수 있는 미용실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #F9F5F0;
      --rose:  #C4725A;
      --rose-dark: #A85A44;
      --rose-light: #F2E8E4;
      --dark:  #1A1A1A;
      --sub:   #7A7A7A;
      --border: #EEEBE6;
      --white: #FFFFFF;
      --shadow-xs: 0 1px 4px rgba(0,0,0,0.06);
      --shadow-sm: 0 2px 10px rgba(0,0,0,0.09);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.13);
      --radius: 12px;
    }
    html, body {
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--cream);
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; }

    /* ══ LAYOUT ══ */
    body { display: flex; flex-direction: column; height: 100dvh; }
    .site-header { flex-shrink: 0; }
    .map-page    { flex: 1; min-height: 0; position: relative; overflow: hidden; }

    /* ══ NAV ══ */
    .nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: relative; z-index: 100;
    }
    .nav-inner {
      display: flex; align-items: center;
      height: 56px; max-width: 1200px;
      margin: 0 auto; padding: 0 20px;
    }
    .nav-logo {
      font-size: 19px; font-weight: 700; color: var(--rose);
      letter-spacing: -0.5px; white-space: nowrap; flex-shrink: 0;
      margin-right: 28px;
    }
    .nav-logo span { color: var(--dark); }
    .nav-links {
      display: flex; align-items: center; gap: 2px;
      list-style: none; flex: 1;
    }
    .nav-links a {
      font-size: 13.5px; font-weight: 500; color: var(--sub);
      padding: 6px 11px; border-radius: 8px;
      transition: background 0.15s, color 0.15s; white-space: nowrap;
    }
    .nav-links a:hover { color: var(--dark); background: var(--cream); }
    .nav-links .nav-salon {
      background: var(--rose); color: var(--white) !important;
      padding: 6px 14px; border-radius: 20px;
      font-weight: 600 !important; margin-left: 6px;
    }
    .nav-links .nav-salon:hover { background: var(--rose-dark) !important; }
    .nav-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .nav-login-btn {
      height: 34px; padding: 0 16px;
      border: 1.5px solid var(--border); border-radius: 20px;
      background: var(--white); color: var(--dark);
      font-size: 13px; font-weight: 600;
      transition: border-color 0.15s, color 0.15s; white-space: nowrap;
    }
    .nav-login-btn:hover { border-color: var(--rose); color: var(--rose); }
    .nav-hamburger {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; padding: 4px;
    }
    .nav-hamburger span { display: block; width: 22px; height: 2px; background: var(--dark); border-radius: 2px; }

    /* ══ SEARCH BAR ══ */
    .search-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      position: relative; z-index: 99;
    }
    .search-wrap {
      position: relative; max-width: 640px; margin: 0 auto;
    }
    .search-icon-left {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--sub); pointer-events: none;
      display: flex; align-items: center;
    }
    .search-wrap input {
      width: 100%; height: 42px;
      padding: 0 48px 0 42px;
      border: 1.5px solid var(--border); border-radius: 22px;
      font-size: 14px; font-family: inherit;
      background: #FAFAFA; color: var(--dark);
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .search-wrap input::placeholder { color: #B5AFA9; }
    .search-wrap input:focus {
      border-color: var(--rose); background: var(--white);
      box-shadow: 0 0 0 3px rgba(196,114,90,0.10);
    }
    .search-submit-btn {
      position: absolute; right: 6px; top: 50%;
      transform: translateY(-50%);
      width: 32px; height: 32px;
      background: var(--rose); border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .search-submit-btn:hover { background: var(--rose-dark); }

    /* ══ AUTOCOMPLETE ══ */
    .autocomplete {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 16px; box-shadow: var(--shadow-md);
      z-index: 200; overflow: hidden;
    }
    .ac-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 16px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.ac-active { background: var(--rose-light); }
    .ac-pin { color: var(--rose); font-size: 14px; flex-shrink: 0; margin-top: 1px; }
    .ac-name { font-size: 13px; font-weight: 600; color: var(--dark); line-height: 1.35; }
    .ac-addr { font-size: 11px; color: var(--sub); margin-top: 2px; }

    /* ══ MAP ══ */
    #map { position: absolute; inset: 0; }

    /* ══ MAP PIN ══ */
    .map-pin {
      background: var(--rose); color: #fff;
      padding: 5px 11px; border-radius: 14px 14px 14px 2px;
      font-size: 12px; font-weight: 700;
      white-space: nowrap; max-width: 130px;
      overflow: hidden; text-overflow: ellipsis;
      box-shadow: 0 2px 10px rgba(196,114,90,0.4);
      cursor: pointer; user-select: none;
      font-family: 'Noto Sans KR', sans-serif;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .map-pin:hover {
      transform: scale(1.07) translateY(-1px);
      box-shadow: 0 4px 14px rgba(196,114,90,0.55);
    }
    .map-pin.partner-pin {
      background: #2D2D2D; color: #FFD966;
      box-shadow: 0 2px 10px rgba(45,45,45,0.45);
      z-index: 5;
    }
    .map-pin.partner-pin:hover {
      box-shadow: 0 4px 14px rgba(45,45,45,0.6);
    }

    /* ══ GPS / RE-SEARCH ══ */
    .gps-btn {
      position: absolute; right: 14px; bottom: calc(44% + 14px);
      z-index: 15; width: 40px; height: 40px;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-sm); transition: 0.2s;
    }
    .gps-btn:hover { border-color: var(--rose); background: var(--rose-light); }
    .re-search-btn {
      position: absolute; top: 14px; left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 15; background: var(--white);
      border: 1.5px solid var(--border); border-radius: 22px;
      padding: 9px 18px; font-size: 13px; font-weight: 600; color: var(--dark);
      display: flex; align-items: center; gap: 6px;
      box-shadow: var(--shadow-md);
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s, transform 0.22s; white-space: nowrap;
    }
    .re-search-btn.show { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
    .re-search-btn:hover { border-color: var(--rose); color: var(--rose); }

    /* ══ PANEL ══ */
    .panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 44%; background: var(--cream);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.10);
      z-index: 20; display: flex; flex-direction: column; overflow: hidden;
      transition: height 0.36s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .panel.expanded { height: 84%; }
    .panel-handle {
      flex-shrink: 0; padding: 12px 0 6px;
      text-align: center; cursor: pointer;
    }
    .panel-handle::before {
      content: ''; display: inline-block;
      width: 36px; height: 4px;
      background: #D8D0C8; border-radius: 2px;
    }
    .panel-head {
      flex-shrink: 0; padding: 4px 16px 12px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .panel-loc-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--rose); flex-shrink: 0;
    }
    .panel-loc-name {
      font-size: 15px; font-weight: 700; color: var(--dark);
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .panel-count { font-size: 12px; color: var(--sub); white-space: nowrap; }

    /* ══ PANEL LIST ══ */
    .panel-list {
      flex: 1; overflow-y: auto;
      padding: 10px 12px 32px;
      display: flex; flex-direction: column; gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .panel-list::-webkit-scrollbar { width: 4px; }
    .panel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ══ SALON CARD ══ */
    .s-card {
      background: var(--white); border-radius: var(--radius);
      padding: 14px 14px 13px;
      display: flex; align-items: flex-start; gap: 12px;
      cursor: pointer; flex-shrink: 0;
      box-shadow: var(--shadow-xs);
      border: 1px solid var(--border);
      border-bottom: 1.5px solid var(--border);
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
    }
    .s-card:hover {
      box-shadow: var(--shadow-sm);
      border-color: rgba(196,114,90,0.3);
      transform: translateY(-1px);
    }
    .s-badge {
      width: 46px; height: 46px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
      flex-shrink: 0; letter-spacing: 0;
    }
    .s-info { flex: 1; min-width: 0; }
    .s-row1 {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px; margin-bottom: 4px;
    }
    .s-name {
      font-size: 14px; font-weight: 700; color: var(--dark);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .s-dist { font-size: 12px; color: var(--sub); white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
    .s-row2 { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .s-stars  { color: #FBBF24; font-size: 11px; }
    .s-rating { font-size: 12px; font-weight: 600; color: #444; }
    .s-dot    { color: #D0C8C0; font-size: 11px; }
    .s-review { font-size: 12px; color: var(--sub); }
    .s-addr   { font-size: 11.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 6px; }
    .s-row3   { display: flex; gap: 5px; }

    /* ══ AVAILABILITY BADGES ══ */
    .bd-avail { background: #22C55E; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; display: inline-block; }
    .bd-soon  { background: #F97316; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; display: inline-block; }
    .bd-full  { background: #9CA3AF; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; display: inline-block; }

    /* ══ STATES ══ */
    .state-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 40px 20px; color: var(--sub); font-size: 14px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border); border-top-color: var(--rose);
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══ RESPONSIVE ══ */
    @media (max-width: 768px) {
      .nav-links      { display: none; }
      .nav-login-btn  { display: none; }
      .nav-hamburger  { display: flex; }
      .nav-links.open {
        display: flex; flex-direction: column;
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: var(--cream); z-index: 98;
        align-items: center; justify-content: center; gap: 28px;
      }
      .nav-links.open a { font-size: 18px; }
      .panel      { height: 46%; }
      .panel.expanded { height: 86%; }
      .gps-btn    { bottom: calc(46% + 14px); }
    }
    @media (max-width: 480px) {
      .nav-inner  { padding: 0 14px; }
      .search-bar { padding: 8px 12px; }
      .panel      { height: 50%; }
      .panel.expanded { height: 88%; }
      .gps-btn    { bottom: calc(50% + 14px); }
    }
  </style>
</head>
<body>

<div class="site-header">
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">헤어<span>이어</span></a>
      <ul class="nav-links" id="navMenu">
        <li><a href="search.html">미용실 찾기</a></li>
        <li><a href="booking.html">빈자리 보기</a></li>
        <li><a href="style-card.html">스타일카드</a></li>
        <li><a href="for-salon.html" class="nav-salon">사장님이신가요?</a></li>
      </ul>
      <div class="nav-actions">
        <button class="nav-login-btn" id="navLoginBtn">로그인</button>
        <button class="nav-hamburger" id="hamburger" aria-label="메뉴">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>
  <div class="search-bar">
    <div class="search-wrap">
      <span class="search-icon-left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><line x1="17" y1="17" x2="22" y2="22"/>
        </svg>
      </span>
      <input type="text" id="navQ" placeholder="미용실, 동네 이름 검색" autocomplete="off" />
      <button class="search-submit-btn" id="searchBtn" aria-label="검색">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/>
        </svg>
      </button>
      <div class="autocomplete" id="autocomplete" style="display:none"></div>
    </div>
  </div>
</div>

<main class="map-page">
  <div id="map"></div>

  <button class="re-search-btn" id="reSearchBtn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    이 지역 재검색
  </button>

  <button class="gps-btn" id="gpsBtn" title="내 위치로 이동">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4725A" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
      <circle cx="12" cy="12" r="8" stroke-opacity=".25"/>
    </svg>
  </button>

  <div class="panel" id="panel">
    <div class="panel-handle" id="panelHandle"></div>
    <div class="panel-head">
      <span class="panel-loc-dot"></span>
      <span class="panel-loc-name" id="locName">위치 확인 중...</span>
      <span class="panel-count" id="locCount"></span>
    </div>
    <div class="panel-list" id="panelBody">
      <div class="state-wrap">
        <div class="spinner"></div>
        <span>현재 위치 기반으로 미용실을 찾고 있어요</span>
      </div>
    </div>
  </div>
</main>

<!-- 카카오 Maps SDK -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e4e580287e144cfed4c34509ce1858d9&autoload=false"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
(function bootMap() {
  if (typeof kakao === 'undefined') {
    console.warn('[Kakao Maps] SDK 로드 실패');
    return;
  }

  /* ── 상태 ── */
  var map, infoOv;
  var pinOvs          = [];
  var _partnerPinOvs  = [];
  var myDotOv         = null;
  var mapMoveTimer    = null;
  var _pinData        = [];

  var RATINGS      = [4.8, 4.6, 4.9, 4.5, 4.7, 4.4, 4.8, 4.3, 4.6, 4.5];
  var AVAILS       = ['available','available','soon','available','full',
                      'available','soon','available','available','available'];
  var REVIEWS      = [124, 87, 203, 56, 142, 91, 178, 63, 119, 88];
  var BADGE_COLORS = ['#C4725A','#4CAF82','#7B68EE','#E08C4A','#3B82F6',
                      '#EC4899','#14B8A6','#F97316','#84CC16','#8B5CF6'];

  /* ── 조회 추적 ── */
  function trackEvent(salonName, eventType) {
    fetch('/api/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ salon_name: salonName, event_type: eventType })
    }).catch(function(){});
  }

  /* ── 파트너 살롱 상태 ── */
  var _partnerSalons = [];
  var _todayStr = (function() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  })();

  /* ── 헬퍼 ── */
  function ratingOf(id)     { return RATINGS [(Math.abs(parseInt(id,10)||0))     % RATINGS.length]; }
  function availOf(id, i)   { return AVAILS  [(Math.abs(parseInt(id,10)||0) + i) % AVAILS.length]; }
  function reviewOf(id, i)  { return REVIEWS [(Math.abs(parseInt(id,10)||0) + i) % REVIEWS.length]; }
  function badgeColor(i)    { return BADGE_COLORS[i % BADGE_COLORS.length]; }
  function starsOf(r)       { return r >= 4.7 ? '★★★★★' : r >= 4.3 ? '★★★★☆' : '★★★☆☆'; }
  function fmtDist(m)       { m = parseInt(m,10); return m < 1000 ? m+'m' : (m/1000).toFixed(1)+'km'; }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  window.openNaverPlace = function(name) {
    window.open('https://map.naver.com/v5/search/' + encodeURIComponent(name + ' 미용실'), '_blank');
  };

  /* ── 지도 초기화 ── */
  kakao.maps.load(function () {
    map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(37.5665, 126.9780),
      level: 4
    });
    kakao.maps.event.addListener(map, 'click', closeInfo);
    kakao.maps.event.addListener(map, 'dragstart', showReSearchBtn);
    kakao.maps.event.addListener(map, 'dragend', function () {
      clearTimeout(mapMoveTimer); hideReSearchBtn(); reSearchFromCenter();
    });
    kakao.maps.event.addListener(map, 'zoom_changed', function () {
      showReSearchBtn();
      clearTimeout(mapMoveTimer);
      mapMoveTimer = setTimeout(function () { hideReSearchBtn(); reSearchFromCenter(); }, 700);
    });
    requestGPS();
    loadPartnerSalons();
  });

  /* ── GPS ── */
  function requestGPS() {
    if (!navigator.geolocation) return useFallback();
    navigator.geolocation.getCurrentPosition(onGPSSuccess, useFallback,
      { enableHighAccuracy: true, timeout: 8000 });
  }
  function onGPSSuccess(pos) {
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    map.setCenter(new kakao.maps.LatLng(lat, lng));
    placeMyDot(lat, lng);
    fetchRegion(lat, lng);
    fetchSalons(lat, lng);
  }
  function useFallback() {
    document.getElementById('locName').textContent = '서울 중구 (기본위치)';
    fetchSalons(37.5665, 126.9780);
  }
  function placeMyDot(lat, lng) {
    if (myDotOv) myDotOv.setMap(null);
    var outer = document.createElement('div');
    outer.style.cssText = 'width:22px;height:22px;border-radius:50%;background:rgba(74,144,226,0.2);display:flex;align-items:center;justify-content:center';
    var inner = document.createElement('div');
    inner.style.cssText = 'width:13px;height:13px;background:#4A90E2;border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(74,144,226,0.5)';
    outer.appendChild(inner);
    myDotOv = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(lat, lng), content: outer, zIndex: 6 });
    myDotOv.setMap(map);
  }

  /* ── API ── */
  async function fetchRegion(lat, lng) {
    try {
      var data = await (await fetch('/api/region?lat=' + lat + '&lng=' + lng)).json();
      var doc  = data.documents && data.documents[0];
      if (!doc) return;
      var name = [doc.region_2depth_name, doc.region_3depth_name].filter(Boolean).join(' ') || doc.address_name;
      document.getElementById('locName').textContent = name;
    } catch(e) {}
  }
  async function fetchSalons(lat, lng, query) {
    query = query || '미용실';
    setLoading(true);
    try {
      var data   = await (await fetch('/api/salons?lat='+lat+'&lng='+lng+'&query='+encodeURIComponent(query))).json();
      var places = data.documents || [];
      _pinData   = places;
      renderPins(places);
      renderCards(places);
      document.getElementById('locCount').textContent = places.length ? places.length + '곳' : '';
    } catch(e) {
      document.getElementById('panelBody').innerHTML =
        '<div class="state-wrap"><span>데이터를 불러올 수 없어요.<br>잠시 후 다시 시도해주세요.</span></div>';
    }
  }
  function setLoading(on) {
    if (on) document.getElementById('panelBody').innerHTML =
      '<div class="state-wrap"><div class="spinner"></div><span>미용실 찾는 중...</span></div>';
  }

  /* ── 핀 ── */
  function clearPins() { pinOvs.forEach(function(o){ o.setMap(null); }); pinOvs = []; }
  function renderPins(places) {
    clearPins();
    places.forEach(function(p, i) {
      var pos = new kakao.maps.LatLng(parseFloat(p.y), parseFloat(p.x));
      var el  = document.createElement('div');
      el.className   = 'map-pin';
      el.textContent = '✂ ' + p.place_name;
      var ov = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 1, zIndex: 3 });
      ov.setMap(map);
      pinOvs.push(ov);
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        showSelectedSalon(p, i);
        map.panTo(pos);
      });
    });
  }

  /* ── 말풍선 닫기 ── */
  function closeInfo() { if (infoOv) { infoOv.setMap(null); infoOv = null; } }
  window.closeInfo = closeInfo;

  /* ── 상세 패널 ── */
  function showSelectedSalon(p, i) {
    trackEvent(p.place_name, 'view');
    var dist   = p.distance ? fmtDist(p.distance) : '-';
    var rating = ratingOf(p.id);
    var review = reviewOf(p.id, i);
    var avail  = availOf(p.id, i);
    var color  = badgeColor(i);
    var char   = esc((p.place_name || '?').charAt(0));
    var stars  = starsOf(rating);
    var bdCls  = avail === 'available' ? 'bd-avail' : avail === 'soon' ? 'bd-soon' : 'bd-full';
    var bdTxt  = avail === 'available' ? '빈자리 있음' : avail === 'soon' ? '마감임박' : '마감';
    var addr   = esc(p.road_address_name || p.address_name || '');

    document.getElementById('panelBody').innerHTML =
      /* 뒤로 버튼 */
      '<div style="padding:4px 2px 10px">' +
        '<button id="btn-back-list" style="display:inline-flex;align-items:center;gap:4px;' +
          'background:none;border:none;color:#C4725A;font-size:13px;font-weight:700;cursor:pointer;' +
          'padding:5px 8px;border-radius:8px;font-family:inherit">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15,18 9,12 15,6"/></svg>' +
          '전체 목록' +
        '</button>' +
      '</div>' +
      /* 카드 */
      '<div style="background:#fff;border-radius:16px;padding:18px 16px 20px;' +
        'box-shadow:0 1px 8px rgba(0,0,0,0.08);border:1px solid #EEEBE6">' +
        /* 헤더 */
        '<div style="display:flex;align-items:center;gap:13px;margin-bottom:12px">' +
          '<div style="width:52px;height:52px;border-radius:50%;background:' + color + ';flex-shrink:0;' +
            'display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff">' +
            char +
          '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:18px;font-weight:700;color:#1A1A1A;margin-bottom:5px;' +
              'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25">' +
              esc(p.place_name) +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:4px;font-size:12.5px;flex-wrap:wrap">' +
              '<span style="color:#FBBF24;font-size:12px">' + stars + '</span>' +
              '<span style="font-weight:600;color:#444">' + rating + '</span>' +
              '<span style="color:#D0C8C0">·</span>' +
              '<span style="color:#7A7A7A">리뷰 ' + review + '</span>' +
              '<span style="color:#D0C8C0">·</span>' +
              '<span style="color:#7A7A7A">' + dist + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        (addr ? '<div style="font-size:12px;color:#7A7A7A;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + addr + '</div>' : '') +
        '<div style="margin-bottom:16px"><span class="' + bdCls + '">' + bdTxt + '</span></div>' +
        /* 예약 버튼 */
        '<button id="btn-naver-selected" style="display:flex;align-items:center;justify-content:center;' +
          'gap:6px;width:100%;background:#C4725A;color:#fff;font-size:15px;font-weight:700;' +
          'padding:15px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;letter-spacing:-0.3px">' +
          '네이버에서 찾아보기 →' +
        '</button>' +
      '</div>';

    document.getElementById('btn-naver-selected').addEventListener('click', function() {
      trackEvent(p.place_name, 'naver_click');
      window.open('https://map.naver.com/v5/search/' + encodeURIComponent(p.place_name + ' 미용실'), '_blank');
    });
    document.getElementById('btn-back-list').addEventListener('click', function() {
      renderCards(_pinData);
    });
    document.getElementById('panel').classList.add('expanded');
  }

  /* ── 카드 리스트 ── */
  function renderCards(places) {
    var body = document.getElementById('panelBody');
    if (!places.length && !_partnerSalons.length) {
      body.innerHTML = '<div class="state-wrap"><span>주변에 미용실이 없어요</span></div>';
      return;
    }

    var partnerHtml = _partnerSalons.map(function(s, pi) {
      var avail = s._avail || 'available';
      var bdCls = avail === 'available' ? 'bd-avail' : avail === 'soon' ? 'bd-soon' : 'bd-full';
      var bdTxt = avail === 'available' ? '빈자리 있음' : avail === 'soon' ? '마감임박' : '마감';
      var char  = esc((s.name || '?').charAt(0));
      return (
        '<div class="s-card" id="pcard-' + pi + '" style="border-color:#C4725A;border-width:1.5px">' +
          '<div class="s-badge" style="background:#C4725A">' + char + '</div>' +
          '<div class="s-info">' +
            '<div class="s-row1">' +
              '<span class="s-name">' + esc(s.name) + '</span>' +
              '<span style="font-size:10px;color:#C4725A;font-weight:700;white-space:nowrap">★ 파트너</span>' +
            '</div>' +
            (s.address ? '<div class="s-addr">' + esc(s.address) + '</div>' : '') +
            '<div class="s-row3"><span class="' + bdCls + '">' + bdTxt + '</span></div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    body.innerHTML = partnerHtml + places.map(function(p, i) {
      var dist   = p.distance ? fmtDist(p.distance) : '-';
      var rating = ratingOf(p.id);
      var review = reviewOf(p.id, i);
      var avail  = availOf(p.id, i);
      var color  = badgeColor(i);
      var char   = esc((p.place_name || '?').charAt(0));
      var stars  = starsOf(rating);
      var bdCls  = avail === 'available' ? 'bd-avail' : avail === 'soon' ? 'bd-soon' : 'bd-full';
      var bdTxt  = avail === 'available' ? '빈자리 있음' : avail === 'soon' ? '마감임박' : '마감';
      var addr   = esc(p.road_address_name || p.address_name || '');
      return (
        '<div class="s-card" id="card-' + i + '">' +
          '<div class="s-badge" style="background:' + color + '">' + char + '</div>' +
          '<div class="s-info">' +
            '<div class="s-row1">' +
              '<span class="s-name">' + esc(p.place_name) + '</span>' +
              '<span class="s-dist">' + dist + '</span>' +
            '</div>' +
            '<div class="s-row2">' +
              '<span class="s-stars">' + stars + '</span>' +
              '<span class="s-rating">' + rating + '</span>' +
              '<span class="s-dot">·</span>' +
              '<span class="s-review">리뷰 ' + review + '</span>' +
            '</div>' +
            (addr ? '<div class="s-addr">' + addr + '</div>' : '') +
            '<div class="s-row3"><span class="' + bdCls + '">' + bdTxt + '</span></div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    _partnerSalons.forEach(function(s, pi) {
      var card = document.getElementById('pcard-' + pi);
      if (!card) return;
      card.addEventListener('click', function() { showPartnerSalon(s); });
    });
    places.forEach(function(p, i) {
      var card = document.getElementById('card-' + i);
      if (!card) return;
      card.addEventListener('click', function() {
        showSelectedSalon(p, i);
        if (map && p.x && p.y) map.panTo(new kakao.maps.LatLng(parseFloat(p.y), parseFloat(p.x)));
      });
    });
  }

  /* ── 위치 버튼 ── */
  function goMyLocation() {
    if (!navigator.geolocation || !map) return;
    navigator.geolocation.getCurrentPosition(function(pos) {
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      map.setCenter(new kakao.maps.LatLng(lat, lng));
      map.setLevel(4);
      placeMyDot(lat, lng);
      fetchRegion(lat, lng);
      clearTimeout(mapMoveTimer); hideReSearchBtn();
      fetchSalons(lat, lng);
    });
  }

  /* ── 재검색 ── */
  function reSearchFromCenter() {
    if (!map) return;
    var c = map.getCenter();
    fetchSalons(c.getLat(), c.getLng());
    fetchRegion(c.getLat(), c.getLng());
  }
  function showReSearchBtn() { document.getElementById('reSearchBtn').classList.add('show'); }
  function hideReSearchBtn() { document.getElementById('reSearchBtn').classList.remove('show'); }
  function onReSearchClick() { clearTimeout(mapMoveTimer); hideReSearchBtn(); reSearchFromCenter(); }

  /* ── 자동완성 ── */
  var acResults = [], acIndex = -1, acTimer = null;

  document.getElementById('navQ').addEventListener('input', function() {
    var q = this.value.trim();
    clearTimeout(acTimer); acIndex = -1;
    if (q.length < 2) { closeAC(); return; }
    acTimer = setTimeout(function() { fetchAC(q); }, 280);
  });
  document.getElementById('navQ').addEventListener('keydown', function(e) {
    var items = document.querySelectorAll('#autocomplete .ac-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acIndex+1, items.length-1); updateACHL(items); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = Math.max(acIndex-1, -1); updateACHL(items); }
    else if (e.key === 'Enter') { acIndex >= 0 && acResults[acIndex] ? goToLocation(acResults[acIndex]) : doSearch(); acIndex = -1; }
    else if (e.key === 'Escape') { closeAC(); }
  });
  document.getElementById('navQ').addEventListener('blur', function() { setTimeout(closeAC, 160); });

  async function fetchAC(q) {
    try {
      var data  = await (await fetch('/api/search-location?query=' + encodeURIComponent(q))).json();
      acResults = data.results || [];
      renderAC(acResults);
    } catch(e) { closeAC(); }
  }
  function renderAC(results) {
    var el = document.getElementById('autocomplete');
    if (!results.length) { el.style.display = 'none'; return; }
    el.innerHTML = results.map(function(r, i) {
      return (
        '<div class="ac-item" data-idx="' + i + '">' +
          '<span class="ac-pin">📍</span>' +
          '<div>' +
            '<div class="ac-name">' + esc(r.name) + '</div>' +
            (r.address ? '<div class="ac-addr">' + esc(r.address) + '</div>' : '') +
          '</div>' +
        '</div>'
      );
    }).join('');
    el.style.display = 'block';
    el.querySelectorAll('.ac-item').forEach(function(item) {
      item.addEventListener('mousedown', function() {
        var idx = parseInt(item.dataset.idx, 10);
        if (acResults[idx]) goToLocation(acResults[idx]);
      });
    });
  }
  function updateACHL(items) { items.forEach(function(el, i) { el.classList.toggle('ac-active', i === acIndex); }); }
  function closeAC() { var el = document.getElementById('autocomplete'); if (el) el.style.display = 'none'; acIndex = -1; }

  function goToLocation(loc) {
    if (!loc || !map) return;
    closeAC();
    var lat = parseFloat(loc.y), lng = parseFloat(loc.x);
    document.getElementById('navQ').value = loc.name;
    map.setCenter(new kakao.maps.LatLng(lat, lng));
    map.setLevel(5);
    fetchSalons(lat, lng);
    document.getElementById('locName').textContent = loc.name + ' 근처';
  }
  async function doSearch() {
    var q = document.getElementById('navQ').value.trim();
    if (!q || !map) return;
    closeAC();
    try {
      var data  = await (await fetch('/api/search-location?query=' + encodeURIComponent(q))).json();
      var first = (data.results || [])[0];
      if (first) { goToLocation(first); }
      else { var c = map.getCenter(); fetchSalons(c.getLat(), c.getLng(), q); document.getElementById('locName').textContent = '"' + q + '" 근처'; }
    } catch(e) { var c = map.getCenter(); fetchSalons(c.getLat(), c.getLng()); }
  }

  /* ── 파트너 살롱 로드 ── */
  async function loadPartnerSalons() {
    try {
      if (typeof SB === 'undefined') { _partnerSalons = []; } else {
        var salons = await SB.getSalons();
        _partnerSalons = await Promise.all(salons.map(async function(s) {
          var slots = await SB.getSlots(s.id, _todayStr).catch(function(){ return {}; });
          return Object.assign({}, s, { _avail: calcPartnerAvail(slots, s.businessHours) });
        }));
      }
    } catch(e) { _partnerSalons = []; }

    /* admin.html localStorage 살롱을 목록 맨 앞에 추가 */
    try {
      var adminSalon = JSON.parse(localStorage.getItem('haireo_admin_salon') || 'null');
      if (adminSalon && adminSalon.name) {
        var adminSlotsAll = JSON.parse(localStorage.getItem('haireo_admin_slots') || '{}');
        var todayRaw = adminSlotsAll[_todayStr] || {};
        var converted = {};
        Object.keys(todayRaw).forEach(function(h) {
          converted[String(h).padStart(2,'0') + ':00'] = todayRaw[h] === 'booked' ? 'blocked' : 'open';
        });
        var avail = calcPartnerAvail(converted, { start: adminSalon.hoursStart || 10, end: adminSalon.hoursEnd || 21 });
        _partnerSalons.unshift({
          id: 'admin-local', name: adminSalon.name,
          address: adminSalon.address || '', phone: adminSalon.phone || '',
          naverUrl: adminSalon.naverUrl || '',
          businessHours: { start: adminSalon.hoursStart || 10, end: adminSalon.hoursEnd || 21 },
          lat: null, lng: null, _avail: avail, _isLocalAdmin: true,
        });
      }
    } catch(e) {}

    renderPartnerPins(_partnerSalons);
    if (_pinData.length) renderCards(_pinData);
  }

  function renderPartnerPins(salons) {
    _partnerPinOvs.forEach(function(o) { o.setMap(null); });
    _partnerPinOvs = [];
    salons.forEach(function(s) {
      if (!s.lat || !s.lng) return;
      var pos = new kakao.maps.LatLng(s.lat, s.lng);
      var el  = document.createElement('div');
      el.className   = 'map-pin partner-pin';
      el.textContent = '⭐ ' + s.name;
      var ov = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 1, zIndex: 5 });
      ov.setMap(map);
      _partnerPinOvs.push(ov);
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        showPartnerSalon(s);
        map.panTo(pos);
      });
    });
  }

  function calcPartnerAvail(slots, hours) {
    var start = (hours && hours.start) || 10, end = (hours && hours.end) || 21;
    var now = new Date(), h = now.getHours();
    var blocked = 0, total = 0;
    for (var t = start; t < end; t++) {
      total++;
      if (slots[String(t).padStart(2,'0') + ':00'] === 'blocked') blocked++;
    }
    if (total === 0 || h >= end) return 'full';
    var ratio = blocked / total;
    return ratio >= 0.8 ? 'full' : ratio >= 0.5 ? 'soon' : 'available';
  }

  /* ── 파트너 살롱 상세 ── */
  async function showPartnerSalon(s) {
    trackEvent(s.name, 'view');
    var slots = {};
    if (s._isLocalAdmin) {
      var adminSlotsAll = {};
      try { adminSlotsAll = JSON.parse(localStorage.getItem('haireo_admin_slots') || '{}'); } catch(e) {}
      var todayRaw = adminSlotsAll[_todayStr] || {};
      Object.keys(todayRaw).forEach(function(h) {
        slots[String(h).padStart(2,'0') + ':00'] = todayRaw[h] === 'booked' ? 'blocked' : 'open';
      });
    } else {
      try { if (typeof SB !== 'undefined') slots = await SB.getSlots(s.id, _todayStr); } catch(e) {}
    }
    var avail = calcPartnerAvail(slots, s.businessHours);
    var bdCls = avail === 'available' ? 'bd-avail' : avail === 'soon' ? 'bd-soon' : 'bd-full';
    var bdTxt = avail === 'available' ? '빈자리 있음' : avail === 'soon' ? '마감임박' : '마감';
    var char  = esc((s.name || '?').charAt(0));
    document.getElementById('panelBody').innerHTML =
      '<div style="padding:4px 2px 10px">' +
        '<button id="btn-back-list" style="display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:#C4725A;font-size:13px;font-weight:700;cursor:pointer;padding:5px 8px;border-radius:8px;font-family:inherit">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15,18 9,12 15,6"/></svg>' +
          '전체 목록' +
        '</button>' +
      '</div>' +
      '<div style="background:#fff;border-radius:16px;padding:18px 16px 20px;box-shadow:0 1px 8px rgba(0,0,0,0.08);border:1.5px solid #C4725A">' +
        '<div style="font-size:11px;color:#C4725A;font-weight:700;margin-bottom:8px">★ 헤어이어 파트너</div>' +
        '<div style="display:flex;align-items:center;gap:13px;margin-bottom:12px">' +
          '<div style="width:52px;height:52px;border-radius:50%;background:#C4725A;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff">' + char + '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:18px;font-weight:700;color:#1A1A1A;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(s.name) + '</div>' +
            (s.phone ? '<div style="font-size:12.5px;color:#7A7A7A">' + esc(s.phone) + '</div>' : '') +
          '</div>' +
        '</div>' +
        (s.address ? '<div style="font-size:12px;color:#7A7A7A;margin-bottom:10px">' + esc(s.address) + '</div>' : '') +
        '<div style="margin-bottom:16px"><span class="' + bdCls + '">' + bdTxt + '</span></div>' +
        '<button id="btn-partner-naver" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:#C4725A;color:#fff;font-size:15px;font-weight:700;padding:15px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;letter-spacing:-0.3px">' +
          '네이버에서 찾아보기 →' +
        '</button>' +
      '</div>';
    document.getElementById('btn-partner-naver').addEventListener('click', function() {
      trackEvent(s.name, 'naver_click');
      var dest = s.naverUrl
        ? s.naverUrl
        : 'https://map.naver.com/v5/search/' + encodeURIComponent(s.name + ' 미용실');
      window.open(dest, '_blank');
    });
    document.getElementById('btn-back-list').addEventListener('click', function() { renderCards(_pinData); });
    document.getElementById('panel').classList.add('expanded');
  }

  /* ── 이벤트 연결 ── */
  document.getElementById('panelHandle').addEventListener('click', function() {
    document.getElementById('panel').classList.toggle('expanded');
  });
  document.getElementById('gpsBtn').addEventListener('click', goMyLocation);
  document.getElementById('reSearchBtn').addEventListener('click', onReSearchClick);
  document.getElementById('searchBtn').addEventListener('click', doSearch);

  /* ── 햄버거 ── */
  var hamburger = document.getElementById('hamburger');
  var navMenu   = document.getElementById('navMenu');
  hamburger.addEventListener('click', function() { navMenu.classList.toggle('open'); });
  navMenu.querySelectorAll('a').forEach(function(l) {
    l.addEventListener('click', function() { navMenu.classList.remove('open'); });
  });

})();
</script>

<script src="login-modal.js"></script>
<script src="owner-bar.js"></script>
</body>
</html>
