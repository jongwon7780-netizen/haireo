<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>빈자리 보기 — 헤어이어</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">헤어<span>이어</span></a>
      <ul class="nav-menu" id="navMenu">
        <li><a href="search.html">미용실 찾기</a></li>
        <li><a href="booking.html" class="active">빈자리 보기</a></li>
        <li><a href="style.html">스타일카드</a></li>
        <li><a href="for-salon.html" class="nav-salon">사장님이신가요?</a></li>
      </ul>
      <button class="nav-hamburger" id="hamburger" aria-label="메뉴"><span></span><span></span><span></span></button>
    </div>
  </nav>
</header>

<div class="container booking-header">
  <div class="booking-live">LIVE</div>
  <h1 class="serif">실시간 예약 가능 현황</h1>
  <p>초록 슬롯을 클릭하면 즉시 예약할 수 있습니다.</p>
</div>

<!-- ─── Filters ─── -->
<div class="filters">
  <div class="filters-inner">
    <div class="filter-row">
      <span class="filter-label">시간대</span>
      <div class="filter-chips" id="timeFilter">
        <button class="chip active" data-time="now">지금바로</button>
        <button class="chip" data-time="17">5시~</button>
        <button class="chip" data-time="18">6시~</button>
        <button class="chip" data-time="19">7시~</button>
        <button class="chip" data-time="20">8시~</button>
        <button class="chip" data-time="any">상관없어요</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">거리</span>
      <div class="filter-chips" id="distFilter">
        <button class="chip active" data-dist="0.5">500m</button>
        <button class="chip" data-dist="1">1km</button>
        <button class="chip" data-dist="2">2km</button>
        <button class="chip" data-dist="5">5km</button>
        <button class="chip" data-dist="99">전체</button>
      </div>
    </div>
  </div>
</div>

<div class="booking-body">
  <div class="booking-legend">
    <div class="legend-item"><div class="legend-dot available"></div>여유</div>
    <div class="legend-item"><div class="legend-dot soon"></div>마감임박</div>
    <div class="legend-item"><div class="legend-dot full"></div>마감</div>
  </div>
  <p class="booking-count" id="salonCount"></p>
  <div class="grid-wrapper">
    <table class="booking-grid">
      <thead id="gridHead"></thead>
      <tbody id="gridBody"></tbody>
    </table>
  </div>
</div>

<!-- ─── Modal ─── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-handle"></div>
    <h2 class="modal-title" id="modalTitle"></h2>
    <p class="modal-sub" id="modalSub"></p>
    <div class="modal-info" id="modalInfo"></div>
    <div class="modal-form">
      <label for="guestName">이름</label>
      <input type="text" id="guestName" placeholder="홍길동" maxlength="20" />
      <label for="guestPhone">연락처</label>
      <input type="tel" id="guestPhone" placeholder="010-0000-0000" maxlength="13" />
      <button class="modal-submit" id="modalSubmit">예약 확정하기</button>
    </div>
  </div>
</div>

<footer>
  <div class="footer-logo">헤어이어</div>
  <div class="footer-links">
    <a href="#">이용약관</a><a href="#">개인정보처리방침</a><a href="#">고객센터</a><a href="for-salon.html">사장님 등록</a>
  </div>
  <p>© 2026 헤어이어. All rights reserved.</p>
</footer>

<script>
const SALONS = [
  { id:1,  name:'헤어살롱 블랑',      dist:0.3 },
  { id:2,  name:'스튜디오 레이어',    dist:0.5 },
  { id:3,  name:'그린헤어',           dist:0.7 },
  { id:4,  name:'헤어아뜰리에',       dist:0.9 },
  { id:5,  name:'살롱드파리',         dist:1.2 },
  { id:6,  name:'커트스튜디오 모노',  dist:1.5 },
  { id:7,  name:'헤어포레',           dist:1.8 },
  { id:8,  name:'더헤어클럽',         dist:2.1 },
  { id:9,  name:'컬러팩토리',         dist:2.6 },
  { id:10, name:'헤어갤러리 봄',      dist:3.2 },
  { id:11, name:'살롱 미뇽',          dist:4.1 },
  { id:12, name:'헤어스튜디오 제로',  dist:4.8 },
];
const ALL_TIMES = [13,14,15,16,17,18,19,20,21];
const STATUS_LABEL = { available:'여유', soon:'임박', full:'마감' };
const now = new Date();
const currentHour = now.getHours();

function randomStatus(h) {
  if (h < currentHour) return 'full';
  if (h === currentHour) return Math.random() < 0.45 ? 'available' : 'soon';
  const r = Math.random();
  if (r < 0.32) return 'available';
  if (r < 0.58) return 'soon';
  if (r < 0.82) return 'full';
  return null;
}

const slotData = {};
SALONS.forEach(s => {
  slotData[s.id] = {};
  ALL_TIMES.forEach(h => { slotData[s.id][h] = randomStatus(h); });
});

let activeTime = 'now', activeDist = 0.5, pendingBooking = null;

function getVisibleTimes() {
  if (activeTime === 'now') return ALL_TIMES.filter(h => h >= currentHour && h <= currentHour + 2);
  if (activeTime === 'any') return ALL_TIMES;
  return ALL_TIMES.filter(h => h >= parseInt(activeTime));
}

function getVisibleSalons() { return SALONS.filter(s => s.dist <= activeDist); }

function render() {
  const times = getVisibleTimes();
  const salons = getVisibleSalons();

  document.getElementById('salonCount').innerHTML =
    `<strong>${salons.length}개</strong> 미용실`;

  let headHtml = '<tr><th class="salon-col">미용실</th>';
  times.forEach(h => { headHtml += `<th>${h}:00</th>`; });
  headHtml += '</tr>';
  document.getElementById('gridHead').innerHTML = headHtml;

  if (salons.length === 0) {
    document.getElementById('gridBody').innerHTML =
      `<tr><td colspan="${times.length+1}" style="padding:40px;text-align:center;color:var(--sub);font-size:14px;">선택한 거리 내 미용실이 없습니다.</td></tr>`;
    return;
  }

  document.getElementById('gridBody').innerHTML = salons.map(s => {
    const distStr = s.dist < 1 ? (s.dist * 1000) + 'm' : s.dist + 'km';
    const cells = times.map(h => {
      const st = slotData[s.id]?.[h];
      if (!st) return `<td><button class="slot slot-empty" disabled><span class="slot-time">${h}:00</span><span class="slot-label">—</span></button></td>`;
      const disabled = st === 'full' ? 'disabled' : `onclick="openModal(${s.id},'${s.name}',${h})"`;
      return `<td><button class="slot slot-${st}" ${disabled}><span class="slot-time">${h}:00</span><span class="slot-label">${STATUS_LABEL[st]}</span></button></td>`;
    }).join('');
    return `<tr><td class="salon-info"><div class="salon-name">${s.name}</div><div class="salon-dist">${distStr}</div></td>${cells}</tr>`;
  }).join('');
}

function openModal(salonId, salonName, time) {
  const st = slotData[salonId]?.[time];
  pendingBooking = { salonId, salonName, time };
  document.getElementById('modalTitle').textContent = salonName;
  document.getElementById('modalSub').textContent = time + ':00 슬롯 예약';
  document.getElementById('modalInfo').innerHTML = `
    <div class="modal-info-row"><span>미용실</span><span>${salonName}</span></div>
    <div class="modal-info-row"><span>예약 시간</span><span>${time}:00 ~ ${time+1}:00</span></div>
    <div class="modal-info-row"><span>상태</span><span style="color:${st==='available'?'var(--green)':'var(--yellow)'}">${st==='available'?'여유 있음':'마감 임박'}</span></div>`;
  document.getElementById('guestName').value = '';
  document.getElementById('guestPhone').value = '';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('guestName').focus(), 300);
}

document.getElementById('modalClose').addEventListener('click', () => { document.getElementById('modalOverlay').classList.remove('open'); pendingBooking=null; });
document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target===document.getElementById('modalOverlay')){document.getElementById('modalOverlay').classList.remove('open');pendingBooking=null;} });
document.getElementById('modalSubmit').addEventListener('click', () => {
  const name = document.getElementById('guestName').value.trim();
  const phone = document.getElementById('guestPhone').value.trim();
  if (!name){alert('이름을 입력해주세요.');return;}
  if (!phone){alert('연락처를 입력해주세요.');return;}
  if (pendingBooking) {
    slotData[pendingBooking.salonId][pendingBooking.time] = 'full';
    document.getElementById('modalOverlay').classList.remove('open');
    render();
    showToast(`${pendingBooking.salonName} ${pendingBooking.time}:00 예약 완료! 📱`);
    pendingBooking = null;
  }
});
document.getElementById('guestPhone').addEventListener('input', e => {
  let v=e.target.value.replace(/\D/g,'');
  if(v.length>3&&v.length<=7)v=v.slice(0,3)+'-'+v.slice(3);
  else if(v.length>7)v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
  e.target.value=v;
});

document.getElementById('timeFilter').addEventListener('click', e => {
  const chip=e.target.closest('.chip');if(!chip)return;
  document.querySelectorAll('#timeFilter .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');activeTime=chip.dataset.time;render();
});
document.getElementById('distFilter').addEventListener('click', e => {
  const chip=e.target.closest('.chip');if(!chip)return;
  document.querySelectorAll('#distFilter .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');activeDist=parseFloat(chip.dataset.dist);render();
});

function showToast(msg) {
  const el=document.createElement('div');el.textContent=msg;
  Object.assign(el.style,{position:'fixed',bottom:'24px',left:'50%',transform:'translateX(-50%)',background:'var(--dark)',color:'#fff',padding:'12px 20px',borderRadius:'30px',fontSize:'14px',fontWeight:'600',zIndex:'999',boxShadow:'0 4px 20px rgba(0,0,0,0.2)',whiteSpace:'nowrap',transition:'opacity 0.4s'});
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),400);},3000);
}

const hamburger=document.getElementById('hamburger'),navMenu=document.getElementById('navMenu');
hamburger.addEventListener('click',()=>navMenu.classList.toggle('open'));
navMenu.querySelectorAll('a').forEach(l=>l.addEventListener('click',()=>navMenu.classList.remove('open')));

render();
</script>
</body>
</html>
