<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>디자이너 포털 — 헤어이어</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --cream:#F9F5F0; --rose:#C4725A; --rose-dark:#A85A44;
      --rose-light:#F2E8E4; --dark:#2D2D2D; --sub:#7A7A7A; --border:#E8E0D8;
    }

    /* ── 로그인 화면 ── */
    .dp-login-wrap {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; background: var(--cream);
    }
    .dp-logo {
      font-family: 'Noto Serif KR', serif;
      font-size: 24px; font-weight: 700; color: var(--rose);
      margin-bottom: 8px;
    }
    .dp-logo span { color: var(--dark); }
    .dp-portal-label {
      font-size: 13px; color: var(--sub); margin-bottom: 36px;
      text-align: center;
    }
    .dp-login-card {
      background: #fff; border-radius: 20px;
      border: 1.5px solid var(--border);
      padding: 32px 28px; width: 100%; max-width: 380px;
    }
    .dp-login-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 20px; font-weight: 600; color: var(--dark);
      margin-bottom: 4px;
    }
    .dp-login-sub { font-size: 13px; color: var(--sub); margin-bottom: 24px; }
    .dp-field { margin-bottom: 14px; }
    .dp-field label {
      display: block; font-size: 12px; font-weight: 700;
      color: var(--dark); margin-bottom: 5px;
    }
    .dp-field input {
      width: 100%; padding: 13px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 15px; color: var(--dark); outline: none;
      font-family: 'Noto Sans KR', sans-serif;
      box-sizing: border-box; transition: border-color 0.2s;
    }
    .dp-field input:focus { border-color: var(--rose); }
    .dp-login-err {
      font-size: 12px; color: #D95C5C;
      margin-bottom: 10px; display: none;
    }
    .dp-login-err.show { display: block; }
    .dp-login-btn {
      width: 100%; padding: 15px; border-radius: 12px; border: none;
      background: var(--dark); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif; transition: background 0.15s;
    }
    .dp-login-btn:hover { background: #111; }
    .dp-login-footer {
      text-align: center; margin-top: 24px;
      font-size: 13px; color: var(--sub);
    }
    .dp-login-footer a { color: var(--rose); text-decoration: none; }

    /* ── 메인 화면 ── */
    .dp-header {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 0; position: sticky; top: 0; z-index: 100;
    }
    .dp-header-inner {
      max-width: 720px; margin: 0 auto;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dp-header-logo {
      font-family: 'Noto Serif KR', serif;
      font-size: 18px; font-weight: 700; color: var(--rose);
    }
    .dp-header-logo span { color: var(--dark); }
    .dp-header-right { display: flex; align-items: center; gap: 10px; }
    .dp-salon-name { font-size: 12px; color: var(--sub); }
    .dp-logout {
      padding: 6px 14px; border-radius: 20px;
      border: 1.5px solid var(--border); background: #fff;
      color: var(--dark); font-size: 13px; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .dp-logout:hover { background: var(--border); }

    /* ── 카드 목록 ── */
    .dp-body { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
    .dp-greeting {
      font-family: 'Noto Serif KR', serif;
      font-size: 22px; font-weight: 600; color: var(--dark);
      margin-bottom: 4px;
    }
    .dp-greeting-sub { font-size: 13px; color: var(--sub); margin-bottom: 24px; }
    .dp-empty {
      text-align: center; padding: 60px 20px;
      color: var(--sub); font-size: 14px; line-height: 1.75;
      background: #fff; border-radius: 16px; border: 1.5px solid var(--border);
    }
    .dp-empty-icon { font-size: 40px; margin-bottom: 12px; }

    .card-item {
      background: #fff; border-radius: 16px;
      border: 1.5px solid var(--border);
      margin-bottom: 12px; overflow: hidden;
      cursor: pointer; transition: all 0.15s;
    }
    .card-item:hover { border-color: var(--rose); box-shadow: 0 4px 16px rgba(196,114,90,0.12); }
    .card-item-hd {
      padding: 16px 18px 12px;
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .card-item-time {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--rose); color: #fff;
      font-size: 13px; font-weight: 700;
      padding: 4px 12px; border-radius: 20px;
      margin-bottom: 8px;
    }
    .card-item-notime {
      display: inline-block;
      background: var(--border); color: var(--sub);
      font-size: 12px; padding: 4px 10px; border-radius: 20px;
      margin-bottom: 8px;
    }
    .card-item-customer {
      font-size: 17px; font-weight: 700; color: var(--dark);
    }
    .card-item-meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .card-item-tags { padding: 0 18px 14px; display: flex; flex-wrap: wrap; gap: 6px; }
    .card-tag {
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; background: var(--rose-light); color: var(--rose); font-weight: 600;
    }
    .card-new-badge {
      background: #D95C5C; color: #fff;
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; white-space: nowrap;
    }

    /* ── 카드 상세 ── */
    .detail-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 1000;
      align-items: flex-end; justify-content: center;
    }
    .detail-overlay.open { display: flex; }
    @media (min-width: 480px) {
      .detail-overlay { align-items: center; }
    }
    .detail-sheet {
      background: #fff; width: 100%; max-width: 600px;
      border-radius: 24px 24px 0 0;
      max-height: 90vh; overflow-y: auto;
      animation: lm-slide-up 0.25s ease;
    }
    @media (min-width: 480px) {
      .detail-sheet { border-radius: 20px; }
    }
    .detail-hd {
      position: sticky; top: 0; background: #fff;
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .detail-hd-title { font-size: 16px; font-weight: 700; color: var(--dark); }
    .detail-close {
      width: 32px; height: 32px; border-radius: 50%;
      border: none; background: var(--border);
      font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .detail-body { padding: 20px; }
    .detail-sec { margin-bottom: 20px; }
    .detail-sec-lbl {
      font-size: 11px; font-weight: 700; color: var(--sub);
      letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px;
    }
    .detail-sec-val {
      font-size: 16px; font-weight: 700; color: var(--dark); line-height: 1.4;
    }
    .detail-sec-val.note {
      font-size: 15px; font-weight: 400; line-height: 1.7;
    }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .detail-tag {
      padding: 6px 14px; border-radius: 20px;
      font-size: 13px; background: var(--rose-light); color: var(--rose); font-weight: 600;
    }
    .detail-divider { height: 1px; background: var(--border); margin: 16px 0; }
    .detail-photos { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 8px; }
    .detail-photo {
      aspect-ratio: 1; border-radius: 10px; overflow: hidden;
      background: var(--border); cursor: pointer;
    }
    .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
    .detail-info-row {
      display: flex; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .detail-info-row:last-child { border-bottom: none; }
    .detail-info-key { color: var(--sub); min-width: 70px; flex-shrink: 0; }
    .detail-info-val { color: var(--dark); font-weight: 600; }
    .detail-date { font-size: 12px; color: var(--sub); margin-top: 16px; text-align: right; }

    /* 전체화면 사진 */
    .photo-full { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; align-items: center; justify-content: center; }
    .photo-full.open { display: flex; }
    .photo-full img { max-width: 95vw; max-height: 95vh; border-radius: 8px; object-fit: contain; }
    .photo-full-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* 필터 */
    .dp-filter-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .dp-filter-label { font-size: 12px; color: var(--sub); font-weight: 700; }
    .dp-filter-chip {
      padding: 6px 14px; border-radius: 20px;
      border: 1.5px solid var(--border); background: #fff;
      font-size: 13px; color: var(--dark); cursor: pointer;
      transition: all 0.15s;
    }
    .dp-filter-chip.active { background: var(--dark); border-color: var(--dark); color: #fff; }
  </style>
</head>
<body style="background:var(--cream)">

<!-- ── 로그인 화면 ── -->
<div id="loginView" class="dp-login-wrap">
  <div class="dp-logo">헤어<span>이어</span></div>
  <p class="dp-portal-label">디자이너 전용 포털</p>
  <div class="dp-login-card">
    <p class="dp-login-title">디자이너 로그인</p>
    <p class="dp-login-sub">미용실 등록 시 설정한 아이디로 로그인하세요</p>
    <div class="dp-field">
      <label>아이디</label>
      <input type="text" id="dLoginId" placeholder="예: jisu" autocomplete="username" />
    </div>
    <div class="dp-field">
      <label>비밀번호</label>
      <input type="password" id="dLoginPw" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')dLogin()" />
    </div>
    <p class="dp-login-err" id="dLoginErr">아이디 또는 비밀번호가 틀렸습니다.</p>
    <button class="dp-login-btn" onclick="dLogin()">로그인</button>
    <div class="dp-login-footer">
      미용실 등록은 <a href="salon-join.html">여기서</a> 하세요
    </div>
  </div>
</div>

<!-- ── 메인 화면 ── -->
<div id="mainView" style="display:none">
  <header class="dp-header">
    <div class="dp-header-inner">
      <a href="index.html" class="dp-header-logo">헤어<span>이어</span></a>
      <div class="dp-header-right">
        <span class="dp-salon-name" id="dSalonName"></span>
        <button class="dp-logout" onclick="dLogout()">로그아웃</button>
      </div>
    </div>
  </header>

  <div class="dp-body">
    <p class="dp-greeting" id="dGreeting"></p>
    <p class="dp-greeting-sub">받은 스타일카드를 확인하세요 ✂</p>

    <div class="dp-filter-bar" id="dpFilterBar" style="display:none">
      <span class="dp-filter-label">기간</span>
      <button class="dp-filter-chip active" onclick="setFilter('all',this)">전체</button>
      <button class="dp-filter-chip" onclick="setFilter('today',this)">오늘</button>
      <button class="dp-filter-chip" onclick="setFilter('week',this)">이번 주</button>
    </div>

    <div id="cardsList"></div>
  </div>
</div>

<!-- ── 카드 상세 오버레이 ── -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-sheet" id="detailSheet">
    <div class="detail-hd">
      <span class="detail-hd-title">스타일카드 상세</span>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- ── 전체화면 사진 ── -->
<div class="photo-full" id="photoFull" onclick="closePhotoFull()">
  <img id="photoFullImg" src="" alt="" />
  <button class="photo-full-close" onclick="closePhotoFull()">✕</button>
</div>

<script src="haireo-data.js"></script>
<script>
/* ═══════════════════════════════════════════════
   designer.html — 디자이너 포털
═══════════════════════════════════════════════ */
const AUTH_KEY = 'haireo_designer_auth';
let dAuth = null;
let allCards = [];
let activeFilter = 'all';

/* ── 초기화 ── */
(function init() {
  try { dAuth = JSON.parse(localStorage.getItem(AUTH_KEY)); } catch(e) {}
  if (dAuth) showMain(); else showLogin();
})();

/* ── 로그인 ── */
function dLogin() {
  const id = (document.getElementById('dLoginId').value || '').trim();
  const pw = document.getElementById('dLoginPw').value || '';
  if (!id || !pw) { showErr('아이디와 비밀번호를 입력해주세요.'); return; }
  const found = HD.findDesigner(id, pw);
  if (found) {
    dAuth = found;
    localStorage.setItem(AUTH_KEY, JSON.stringify(dAuth));
    showMain();
  } else {
    showErr('아이디 또는 비밀번호가 틀렸습니다.');
  }
}
function showErr(msg) {
  const el = document.getElementById('dLoginErr');
  el.textContent = msg;
  el.classList.add('show');
}

/* ── 로그아웃 ── */
function dLogout() {
  dAuth = null;
  localStorage.removeItem(AUTH_KEY);
  allCards = [];
  showLogin();
  document.getElementById('dLoginId').value = '';
  document.getElementById('dLoginPw').value = '';
  document.getElementById('dLoginErr').classList.remove('show');
}

/* ── 화면 전환 ── */
function showLogin() {
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('mainView').style.display = 'none';
  setTimeout(() => {
    const el = document.getElementById('dLoginId');
    if (el) el.focus();
  }, 100);
}
function showMain() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  document.getElementById('dGreeting').textContent = `안녕하세요, ${dAuth.name}님`;
  document.getElementById('dSalonName').textContent = dAuth.salonName;
  loadCards();
}

/* ── 카드 로드 ── */
function loadCards() {
  allCards = HD.getCardsByDesigner(dAuth.loginId);
  if (allCards.length > 0) {
    document.getElementById('dpFilterBar').style.display = 'flex';
  }
  renderCards();
}

/* ── 필터 ── */
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.dp-filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function getFilteredCards() {
  if (activeFilter === 'all') return allCards;
  const now = new Date();
  return allCards.filter(c => {
    const d = new Date(c.createdAt);
    if (activeFilter === 'today') {
      return d.toDateString() === now.toDateString();
    }
    if (activeFilter === 'week') {
      const weekAgo = new Date(now - 7 * 86400000);
      return d >= weekAgo;
    }
    return true;
  });
}

/* ── 카드 목록 렌더 ── */
function renderCards() {
  const list = document.getElementById('cardsList');
  const cards = getFilteredCards();

  if (!cards.length) {
    const msg = allCards.length > 0
      ? '해당 기간에 받은 카드가 없습니다.'
      : '아직 받은 스타일카드가 없어요.\n고객이 스타일카드를 작성하면 여기에 나타납니다.';
    list.innerHTML = `<div class="dp-empty">
      <div class="dp-empty-icon">✂️</div>
      <div style="white-space:pre-line">${esc(msg)}</div>
    </div>`;
    return;
  }

  // 날짜별 그룹
  const groups = {};
  cards.forEach(c => {
    const key = c.createdAt ? c.createdAt.slice(0, 10) : '날짜 없음';
    if (!groups[key]) groups[key] = [];
    groups[key].push(c);
  });

  list.innerHTML = Object.entries(groups)
    .sort(([a],[b]) => b.localeCompare(a))
    .map(([date, grpCards]) => `
      <div style="font-size:12px;font-weight:700;color:var(--sub);margin:20px 0 8px;first-of-type:margin-top:0">${fmtDate(date)}</div>
      ${grpCards.map((c, i) => cardItemHtml(c, i)).join('')}
    `).join('');
}

function fmtDate(dateStr) {
  try {
    const d = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date(today - 86400000);
    if (d.toDateString() === today.toDateString()) return '오늘';
    if (d.toDateString() === yesterday.toDateString()) return '어제';
    return `${d.getMonth()+1}월 ${d.getDate()}일`;
  } catch { return dateStr; }
}

function isNew(card) {
  if (!card.createdAt) return false;
  const diffH = (Date.now() - new Date(card.createdAt)) / 3600000;
  return diffH < 2;
}

function cardItemHtml(c) {
  const tags = [...(c.styles||[]), ...(c.color ? [c.color] : [])];
  const name = c.customerName || '익명의 고객';
  const timeHtml = c.appointmentTime
    ? `<span class="card-item-time">🕐 ${esc(c.appointmentTime)}</span>`
    : `<span class="card-item-notime">예약 시간 미정</span>`;
  const gender = c.gender || '';
  return `
    <div class="card-item" onclick="openDetail('${esc(c.id)}')">
      <div class="card-item-hd">
        <div>
          ${timeHtml}
          <div class="card-item-customer">${esc(name)}</div>
          <div class="card-item-meta">${gender}${gender && c.styles?.length ? ' · ' : ''}${(c.styles||[]).slice(0,2).map(esc).join(', ')}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          ${isNew(c) ? '<span class="card-new-badge">NEW</span>' : ''}
          ${(c.photos||[]).length > 0 ? `<span style="font-size:12px;color:var(--sub)">📷 ${c.photos.length}</span>` : ''}
        </div>
      </div>
      ${tags.length ? `<div class="card-item-tags">${tags.map(t=>`<span class="card-tag">#${esc(t)}</span>`).join('')}</div>` : ''}
    </div>`;
}

/* ── 카드 상세 ── */
function openDetail(cardId) {
  const card = allCards.find(c => c.id === cardId);
  if (!card) return;
  const body = document.getElementById('detailBody');
  const note = card.freeText || '';
  const tags = [...(card.styles||[]), ...(card.color ? [card.color] : [])];

  body.innerHTML = `
    <div class="detail-sec">
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px">
        ${card.appointmentTime ? `<span class="card-item-time" style="margin-bottom:0">🕐 ${esc(card.appointmentTime)}</span>` : ''}
        ${isNew(card) ? '<span class="card-new-badge">NEW</span>' : ''}
      </div>
    </div>

    <div style="background:var(--cream);border-radius:12px;padding:14px 16px;margin-bottom:20px">
      <div class="detail-info-row">
        <span class="detail-info-key">고객</span>
        <span class="detail-info-val">${esc(card.customerName || '익명')}</span>
      </div>
      <div class="detail-info-row">
        <span class="detail-info-key">성별</span>
        <span class="detail-info-val">${esc(card.gender || '미선택')}</span>
      </div>
      ${card.appointmentTime ? `<div class="detail-info-row">
        <span class="detail-info-key">예약 시간</span>
        <span class="detail-info-val">${esc(card.appointmentTime)}</span>
      </div>` : ''}
      <div class="detail-info-row">
        <span class="detail-info-key">미용실</span>
        <span class="detail-info-val">${esc(card.salonName || '')}</span>
      </div>
    </div>

    ${(card.styles||[]).length ? `
    <div class="detail-sec">
      <div class="detail-sec-lbl">원하는 스타일</div>
      <div class="detail-sec-val">${card.styles.map(esc).join(' · ')}</div>
    </div>
    <div class="detail-divider"></div>` : ''}

    ${card.color ? `
    <div class="detail-sec">
      <div class="detail-sec-lbl">색상</div>
      <div class="detail-sec-val">${esc(card.color)}</div>
    </div>
    <div class="detail-divider"></div>` : ''}

    ${note ? `
    <div class="detail-sec">
      <div class="detail-sec-lbl">요청사항</div>
      <div class="detail-sec-val note" style="white-space:pre-wrap">${esc(note)}</div>
    </div>
    <div class="detail-divider"></div>` : ''}

    ${tags.length ? `
    <div class="detail-sec">
      <div class="detail-tags">${tags.map(t=>`<span class="detail-tag">#${esc(t)}</span>`).join('')}</div>
    </div>` : ''}

    ${(card.photos||[]).filter(Boolean).length ? `
    <div class="detail-sec">
      <div class="detail-sec-lbl">참고 사진 (${card.photos.filter(Boolean).length}장)</div>
      <div class="detail-photos">
        ${card.photos.filter(Boolean).map((p, i) => `
          <div class="detail-photo" onclick="openPhotoFull('${i}','${esc(card.id)}')">
            <img src="${p}" alt="참고 사진 ${i+1}" loading="lazy" />
          </div>`).join('')}
      </div>
    </div>` : ''}

    <div class="detail-date">받은 시간: ${fmtDatetime(card.createdAt)}</div>`;

  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── 전체화면 사진 ── */
let _photoCard = null;
function openPhotoFull(idx, cardId) {
  _photoCard = allCards.find(c => c.id === cardId);
  if (!_photoCard) return;
  document.getElementById('photoFullImg').src = _photoCard.photos[parseInt(idx)];
  document.getElementById('photoFull').classList.add('open');
}
function closePhotoFull() {
  document.getElementById('photoFull').classList.remove('open');
}

/* ── 유틸 ── */
function fmtDatetime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  } catch { return iso; }
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
